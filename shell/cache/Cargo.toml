[package]
name = "ieummae-cache"
version = "0.1.0"
edition = "2021"

# 상태 캐시 프로세스 - 저장소 감시 + git status, 오버레이 DLL 에 파이프로 응답
[[bin]]
name = "ieummae-cache"
path = "src/main.rs"

[dependencies]
ieummae-common = { path = "../common" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
